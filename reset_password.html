<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Grow by Numbers</title>
<style>
  body {
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f4f8f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 90%;
    max-width: 380px;
  }
  h1 { font-size: 1.3rem; color: #1B5E20; margin-top: 0; }
  input {
    width: 100%;
    padding: 0.6rem;
    margin: 0.5rem 0 1rem 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    background: #388E3C;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { background: #a5d6a7; cursor: not-allowed; }
  .message { margin-top: 1rem; font-size: 0.95rem; }
  .error { color: #c62828; }
  .success { color: #2e7d32; }
</style>
</head>
<body>

<div class="card">
  <h1>🌱 Reset your password</h1>
  <div id="loading">Checking your reset link…</div>

  <form id="reset-form" style="display:none;">
    <label for="password">New password</label>
    <input type="password" id="password" minlength="6" required>
    <button type="submit" id="submit-btn">Set new password</button>
  </form>

  <div id="message" class="message"></div>
</div>

<!-- Supabase's browser library — this page runs real JS in the browser,
     so unlike Streamlit it CAN read the recovery token from the URL. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ---- Fill these in with your own project's values ----
  // Same ones you already have in .streamlit/secrets.toml
  const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-PUBLISHABLE-KEY";
  // --------------------------------------------------------

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loadingEl = document.getElementById("loading");
  const formEl = document.getElementById("reset-form");
  const messageEl = document.getElementById("message");
  const submitBtn = document.getElementById("submit-btn");

  // supabase-js automatically reads the access_token from the URL's #
  // fragment (the part Streamlit never sees) and fires this event once
  // it's recognized a password-recovery link.
  client.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      loadingEl.style.display = "none";
      formEl.style.display = "block";
    }
  });

  // If the link didn't contain a valid recovery token, show an error
  // after a moment rather than leaving "Checking..." up forever.
  setTimeout(() => {
    if (formEl.style.display === "none") {
      loadingEl.textContent = "This reset link is invalid or has expired.";
    }
  }, 3000);

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      messageEl.innerHTML = `<span class="error">${error.message}</span>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Set new password";
    } else {
      formEl.style.display = "none";
      messageEl.innerHTML =
        '<span class="success">Password updated! You can close this tab and log in to Grow by Numbers.</span>';
    }
  });
</script>

</body>
</html>
